<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free ATS Resume Builder - Create Single-Page A4 Resumes</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Build an ATS-optimized single-page A4 resume online for free. Download clean, professional PDF resumes instantly with zero registration or watermarks.">
    <meta name="keywords" content="free ATS resume builder, A4 resume generator, one page CV maker, ATS compliant resume templates, free PDF resume, single page resume creator">
    <meta name="robots" content="index, follow">

    <!-- OpenGraph / Social Previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Free ATS Resume Builder - Create Single-Page A4 Resumes">
    <meta property="og:description" content="Build an ATS-optimized single-page A4 resume online for free. Clean layouts, instant live preview, zero sign-up required.">
    <meta property="og:url" content="https://yourcvbuilder.vercel.app">

    <!-- Google WebApplication Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Free ATS Resume Builder",
      "url": "https://yourcvbuilder.vercel.app",
      "operatingSystem": "All",
      "applicationCategory": "BusinessApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Google FAQ Schema for Rich Search Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is this ATS Resume Builder completely free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, our resume builder is 100% free forever. You can create, preview, and download unlimited single-page A4 PDF resumes without any hidden fees, subscriptions, or watermarks."
          }
        },
        {
          "@type": "Question",
          "name": "Is my personal information stored on a server?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. All resume data processing happens locally inside your web browser. Your details are never transmitted, saved, or uploaded to external databases."
          }
        },
        {
          "@type": "Question",
          "name": "What makes a resume ATS-compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An ATS-compliant resume uses clean headings, standard font hierarchies, single-column structures, and plain bullet points so Applicant Tracking Systems can easily parse your experience."
          }
        }
      ]
    }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        .a4-page {
            width: 210mm;
            height: 297mm;
            padding: 10mm 12mm;
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: normal;
            word-spacing: normal;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header & Hero Title -->
    <header class="bg-slate-900 text-white shadow-md py-6 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Free ATS Resume Builder</h1>
                <p class="text-xs text-slate-400 mt-1">Create single-page A4 PDF resumes with zero login, paywalls, or watermarks.</p>
            </div>
            <button type="button" onclick="downloadPDF()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-semibold shadow hover:bg-indigo-700 transition">
                Download A4 PDF (100% Free)
            </button>
        </div>
    </header>

    <!-- Main Builder Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        
        <!-- LEFT: Form Wizard -->
        <div class="w-full space-y-4">
            <div class="bg-white rounded-xl shadow-md p-5 flex flex-col justify-between">
                
                <!-- Navigation Tabs -->
                <div id="tabs-container" class="flex border-b border-slate-200 pb-3 mb-4 justify-between text-xs font-semibold overflow-x-auto gap-2">
                    <button type="button" onclick="setStep(1)" id="tab-1" class="step-tab text-indigo-600 border-b-2 border-indigo-600 pb-1 px-1 whitespace-nowrap cursor-pointer">1. Header</button>
                    <button type="button" onclick="setStep(2)" id="tab-2" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">2. Summary</button>
                    <button type="button" onclick="setStep(3)" id="tab-3" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">3. Experience</button>
                    <button type="button" onclick="setStep(4)" id="tab-4" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">4. Projects</button>
                    <button type="button" onclick="setStep(5)" id="tab-5" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">5. Education</button>
                    <button type="button" onclick="setStep(6)" id="tab-6" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">6. Skills & Certs</button>
                    <button type="button" onclick="setStep(7)" id="tab-7" class="step-tab text-slate-400 pb-1 px-1 whitespace-nowrap cursor-pointer">7. References</button>
                </div>

                <!-- Form Content -->
                <div class="space-y-4">
                    <!-- STEP 1 -->
                    <div id="step-1" class="wizard-step space-y-4">
                        <h3 class="text-sm font-bold text-slate-900 uppercase">1. Personal Information & Template Style</h3>
                        
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Resume Template Style</label>
                            <select id="input-template" onchange="updateResume()" class="w-full p-2 text-sm border rounded bg-white font-medium text-slate-700">
                                <option value="classic">Classic Professional (Clean & Structured)</option>
                                <option value="modern">Modern Split (Indigo Accent Border)</option>
                                <option value="minimal">Minimalist Clean (Serif Typography)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Profile Photo (Optional)</label>
                            <input type="file" id="input-image" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-600">Full Name</label>
                                <input type="text" id="input-name" value="Alex Morgan" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600">Job Title</label>
                                <input type="text" id="input-title" value="Senior Full Stack Software Engineer" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600">Email</label>
                                <input type="text" id="input-email" value="alex.morgan@email.com" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600">Phone</label>
                                <input type="text" id="input-phone" value="+1 (555) 382-9102" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600">Location</label>
                                <input type="text" id="input-location" value="San Francisco, CA" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-600">LinkedIn / Portfolio</label>
                                <input type="text" id="input-links" value="linkedin.com/in/alexmorgan" oninput="updateResume()" class="mt-1 w-full p-2 text-sm border rounded">
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2 -->
                    <div id="step-2" class="wizard-step space-y-4 hidden">
                        <h3 class="text-sm font-bold text-slate-900 uppercase">2. Professional Summary</h3>
                        <textarea id="input-summary" rows="4" oninput="updateResume()" class="w-full p-2 text-sm border rounded">Innovative Senior Full Stack Engineer with 7+ years of experience designing scalable microservices and high-throughput web applications. Proven track record of improving system performance by 40% and leading high-performing engineering teams in agile environments.</textarea>
                    </div>

                    <!-- STEP 3 -->
                    <div id="step-3" class="wizard-step space-y-4 hidden">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-slate-900 uppercase">3. Work Experience</h3>
                            <button type="button" onclick="addExperience()" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded font-semibold">+ Add Job</button>
                        </div>
                        <div id="experience-container" class="space-y-4">
                            <div class="p-3 bg-slate-50 border rounded-lg space-y-2 exp-item relative">
                                <button type="button" onclick="removeItem(this)" class="absolute top-2 right-2 text-red-500 text-xs font-bold">✕</button>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" placeholder="Company" value="Apex Cloud Technologies" oninput="updateResume()" class="p-1.5 text-xs border rounded exp-company">
                                    <input type="text" placeholder="Role" value="Senior Engineer" oninput="updateResume()" class="p-1.5 text-xs border rounded exp-role">
                                </div>
                                <input type="text" placeholder="Dates" value="Jan 2022 - Present" oninput="updateResume()" class="w-full p-1.5 text-xs border rounded exp-dates">
                                <textarea placeholder="Accomplishments..." oninput="updateResume()" rows="2" class="w-full p-1.5 text-xs border rounded exp-desc">Architected microservices using Node.js and AWS, reducing latency by 35%.</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 4 -->
                    <div id="step-4" class="wizard-step space-y-4 hidden">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-slate-900 uppercase">4. Key Projects</h3>
                            <button type="button" onclick="addProject()" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded font-semibold">+ Add Project</button>
                        </div>
                        <div id="project-container" class="space-y-4">
                            <div class="p-3 bg-slate-50 border rounded-lg space-y-2 proj-item relative">
                                <button type="button" onclick="removeItem(this)" class="absolute top-2 right-2 text-red-500 text-xs font-bold">✕</button>
                                <input type="text" placeholder="Project Name" value="CloudScale Dashboard" oninput="updateResume()" class="w-full p-1.5 text-xs border rounded proj-name">
                                <input type="text" placeholder="Technologies" value="React, Node.js, Docker" oninput="updateResume()" class="w-full p-1.5 text-xs border rounded proj-tech">
                                <textarea placeholder="Description..." oninput="updateResume()" rows="2" class="w-full p-1.5 text-xs border rounded proj-desc">Built a real-time monitoring tool utilized by over 5,000 developers.</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 5 -->
                    <div id="step-5" class="wizard-step space-y-4 hidden">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-slate-900 uppercase">5. Education</h3>
                            <button type="button" onclick="addEducation()" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded font-semibold">+ Add Degree</button>
                        </div>
                        <div id="education-container" class="space-y-4">
                            <div class="p-3 bg-slate-50 border rounded-lg space-y-2 edu-item relative">
                                <button type="button" onclick="removeItem(this)" class="absolute top-2 right-2 text-red-500 text-xs font-bold">✕</button>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="text" placeholder="Degree" value="B.S. in Computer Science" oninput="updateResume()" class="p-1.5 text-xs border rounded edu-degree">
                                    <input type="text" placeholder="Institution" value="UC Berkeley" oninput="updateResume()" class="p-1.5 text-xs border rounded edu-uni">
                                </div>
                                <input type="text" placeholder="Year" value="2019" oninput="updateResume()" class="w-full p-1.5 text-xs border rounded edu-year">
                            </div>
                        </div>
                    </div>

                    <!-- STEP 6 -->
                    <div id="step-6" class="wizard-step space-y-4 hidden">
                        <h3 class="text-sm font-bold text-slate-900 uppercase">6. Skills & Certifications</h3>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Certifications</label>
                            <input type="text" id="input-certs" value="AWS Certified Solutions Architect, Certified Kubernetes Administrator" oninput="updateResume()" class="w-full p-2 text-sm border rounded">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-600 mb-1">Technical Skills</label>
                            <input type="text" id="input-skills" value="JavaScript, TypeScript, React, Node.js, Python, PostgreSQL, Docker, AWS" oninput="updateResume()" class="w-full p-2 text-sm border rounded">
                        </div>
                    </div>

                    <!-- STEP 7 -->
                    <div id="step-7" class="wizard-step space-y-4 hidden">
                        <div class="flex justify-between items-center">
                            <h3 class="text-sm font-bold text-slate-900 uppercase">7. Professional References</h3>
                            <button type="button" onclick="addReference()" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded font-semibold">+ Add Reference</button>
                        </div>
                        <div id="reference-container" class="space-y-4"></div>
                    </div>
                </div>

                <!-- Navigation Controls -->
                <div class="flex justify-between pt-4 border-t border-slate-200 mt-6">
                    <button type="button" id="prev-btn" onclick="changeStep(-1)" class="bg-slate-200 text-slate-700 px-4 py-2 rounded text-xs font-semibold opacity-50 cursor-not-allowed" disabled>Previous</button>
                    <button type="button" id="next-btn" onclick="changeStep(1)" class="bg-indigo-600 text-white px-4 py-2 rounded text-xs font-semibold">Next Step</button>
                </div>

            </div>

            <!-- AD BANNER SLOT 1 (Sidebar) -->
            <div class="bg-slate-200 border-2 border-dashed
